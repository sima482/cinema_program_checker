<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kontrola filmového programu</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>🎬 Kontrola filmového programu</h1>
  <p class="lead">Excel ↔ Cinema City • celý programový týždeň štvrtok → streda</p>
  <section>
    <div class="grid">
      <label>1. Excel
        <input id="excel" type="file" accept=".xlsx">
      </label>
      <label>2. Kino
        <select id="cinema"><option>Eurovea</option><option>Aupark</option><option>Polus</option></select>
      </label>
      <label>3. Začiatok týždňa
        <input id="start" type="date" value="2026-10-08">
      </label>
    </div>
    <div id="range" class="range"></div>
    <div class="actions">
      <button id="preview" class="secondary">Ukázať, čo čítam z Excelu</button>
      <button id="webpreview" class="secondary">Ukázať, čo čítam z Cinema City</button>
      <button id="go">Skontrolovať celý týždeň</button>
    </div>
  </section>
  <section id="status" class="status">Nahraj Excel, vyber kino a štvrtok programového týždňa.</section>
  <section id="results" class="results"></section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
