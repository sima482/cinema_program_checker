<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kontrola filmového programu</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>🎬 Kontrola filmového programu</h1>
  <p class="lead">Excel ↔ Cinema City • programový týždeň štvrtok → streda</p>
  <section>
    <div class="grid">
      <label>1. Excel
        <input id="excel" type="file" accept=".xlsx">
      </label>
      <label>2. Kino
        <select id="cinema"><option>Eurovea</option><option>Aupark</option><option>Polus</option></select>
      </label>
      <label>3. Začiatok týždňa
        <input id="start" type="date" value="2026-10-08">
      </label>
    </div>
    <div id="range" class="range"></div>
    <div id="day-selector" style="margin:16px 0;padding:14px 16px;border:1px solid rgba(255,255,255,.14);border-radius:12px">
      <div style="font-weight:800;margin-bottom:10px">4. Dni na kontrolu</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:6px"><input class="day-check" type="checkbox" value="0" checked> Štvrtok</label>
        <label style="display:flex;align-items:center;gap:6px"><input class="day-check" type="checkbox" value="1" checked> Piatok</label>
        <label style="display:flex;align-items:center;gap:6px"><input class="day-check" type="checkbox" value="2" checked> Sobota</label>
        <label style="display:flex;align-items:center;gap:6px"><input class="day-check" type="checkbox" value="3" checked> Nedeľa</label>
        <label style="display:flex;align-items:center;gap:6px"><input class="day-check" type="checkbox" value="4" checked> Pondelok</label>
        <label style="display:flex;align-items:center;gap:6px"><input class="day-check" type="checkbox" value="5" checked> Utorok</label>
        <label style="display:flex;align-items:center;gap:6px"><input class="day-check" type="checkbox" value="6" checked> Streda</label>
      </div>
    </div>
    <div class="actions">
      <button id="preview" class="secondary">Ukázať, čo čítam z Excelu</button>
      <button id="webpreview" class="secondary">Ukázať, čo čítam z Cinema City</button>
      <button id="go">Skontrolovať vybrané dni</button>
    </div>
  </section>
  <section id="status" class="status">Nahraj Excel, vyber kino, štvrtok a dni na kontrolu.</section>
  <section id="results" class="results"></section>
</main>
<script src="/static/app.js?v=29"></script>
</body>
</html>
